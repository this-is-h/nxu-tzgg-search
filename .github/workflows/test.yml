name: test
# master分支触发
on:
    push:
        branches:
            - 'main'
    workflow_dispatch:

jobs:
    docsearch:
        runs-on: ubuntu-latest
        name: Algolia DocSearch
        steps:
            - uses: actions/checkout@v2
            - uses: darrenjennings/algolia-docsearch-action@master
              with:
                  algolia_api_key: ${{ secrets.ALGOLIA_API_KEY_TEST }}
                  algolia_application_id: ${{ secrets.ALGOLIA_APPLICATION_IDY_TEST }}
                  # needs to be inside $GITHUB_WORKSPACE from actions/checkout step
                  file: 'test.json'

